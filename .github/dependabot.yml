version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "grimley517"

  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/PagedList"
      - "/PagedList.Tests"
    schedule:
      interval: "weekly"
      day: "tuesday"
    assignees:
      - "grimley517"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    assignees:
      - "grimley517"
